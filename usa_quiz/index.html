<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>アメリカ基礎クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 1カラムの出題カード。上に設定バー、進捗は13本の縞に見立てたセグメント */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #15213d;
  --muted: #5a6479;
  --line: #d3d9e4;
  --land: #dbe1eb;
  --land-line: #ffffff;
  --mark: #2147b0;
  --mark-soft: #c9d6f6;
  --star: #b8262b;
  --ok: #1d7a4c;
  --ok-bg: #e2f3ea;
  --ng: #b3262b;
  --ng-bg: #fbe6e6;
  --focus: #2147b0;
  --font-display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1322; --surface: #151d31; --ink: #e5e9f2; --muted: #9aa3b7; --line: #29344d;
    --land: #263049; --land-line: #151d31; --mark: #7c9dff; --mark-soft: #34467a; --star: #ff7a7a;
    --ok: #4cc38a; --ok-bg: #173527; --ng: #f07a7a; --ng-bg: #3b1c22; --focus: #9db6ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1322; --surface: #151d31; --ink: #e5e9f2; --muted: #9aa3b7; --line: #29344d;
  --land: #263049; --land-line: #151d31; --mark: #7c9dff; --mark-soft: #34467a; --star: #ff7a7a;
  --ok: #4cc38a; --ok-bg: #173527; --ng: #f07a7a; --ng-bg: #3b1c22; --focus: #9db6ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
#study-subs { max-width: 100%; overflow-x: auto; justify-self: start; }
#study-subs button { white-space: nowrap; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px;
}
header { display: grid; gap: 4px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.75rem; line-height: 1.25; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); font-size: 0.9rem; }

.settings { display: grid; gap: 10px; }
.label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 0.85rem; font-weight: 500; color: var(--ink);
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .rate { font-family: var(--font-mono); font-size: 0.72rem; opacity: 0.7; }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 0.85rem; background: transparent; color: var(--ink); border: 0; padding: 5px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--mark-soft); font-weight: 700; }
.btn {
  font: inherit; font-weight: 700; font-size: 0.95rem; cursor: pointer;
  background: var(--ink); color: var(--bg); border: 0; border-radius: 10px; padding: 10px 18px;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px; display: grid; gap: 14px; min-width: 0;
}
.status { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--muted); }
.status .num { font-family: var(--font-mono); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.stripes { display: flex; gap: 3px; }
.stripes i { flex: 1; height: 6px; border-radius: 2px; background: var(--line); }
.stripes i.ok { background: var(--ok); }
.stripes i.ng { background: var(--ng); }
.stripes i.now { background: var(--mark); }
.tag { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; color: var(--mark); }
.prompt { font-size: 1.25rem; font-weight: 700; line-height: 1.5; margin: 0; text-wrap: balance; }
.prompt .en { display: block; font-size: 0.85rem; font-weight: 400; color: var(--muted); }

.map { width: 100%; max-width: 100%; height: auto; display: block; }
.map .st { fill: var(--land); }
.map .st.hl { fill: var(--mark); }
.map .st.ng { fill: var(--ng); }
.map .borders { fill: none; stroke: var(--land-line); stroke-width: 0.8; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.map .ring { fill: none; stroke: var(--mark); stroke-width: 2.5; }
.map .capstar { fill: var(--star); stroke: var(--surface); stroke-width: 1.5; }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .choices { grid-template-columns: 1fr; } }
.choice {
  font: inherit; font-size: 1rem; font-weight: 500; text-align: left; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; min-width: 0;
}
.choice:hover:not(:disabled) { border-color: var(--mark); }
.choice:disabled { cursor: default; }
.choice .key { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); flex: none; }
.choice .txt { min-width: 0; overflow-wrap: anywhere; }
.choice.ok { background: var(--ok-bg); border-color: var(--ok); }
.choice.ng { background: var(--ng-bg); border-color: var(--ng); }
.choices.one { grid-template-columns: 1fr; }
.choice.picked { border-color: var(--mark); }
.choice .ord {
  flex: none; align-self: center; width: 1.5rem; height: 1.5rem; border-radius: 50%;
  border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600;
}
.choice.picked .ord, .choice.ok .ord, .choice.ng .ord { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.mono { font-family: var(--font-mono); font-weight: 600; }

.feedback { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
.verdict { font-weight: 700; font-size: 1.05rem; }
.verdict.ok { color: var(--ok); }
.verdict.ng { color: var(--ng); }
.note { margin: 0; color: var(--ink); max-width: 62ch; }
.actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.hint { font-size: 0.75rem; color: var(--muted); }

.result h2 { font-family: var(--font-display); font-weight: 400; font-size: 2.4rem; margin: 0; line-height: 1.1; }
.result h2 small { font-family: var(--font-body); font-size: 1rem; font-weight: 500; color: var(--muted); margin-left: 6px; }
.missed { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.missed li { border-left: 3px solid var(--ng); padding-left: 10px; }
.missed .q { font-weight: 500; }
.missed .a { color: var(--muted); font-size: 0.9rem; }
footer { font-size: 0.75rem; color: var(--muted); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab {
  font: inherit; font-weight: 700; font-size: 1rem; color: var(--muted); cursor: pointer;
  background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 8px 14px;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--mark); }
.view { display: grid; gap: 16px; }
.map .st.rg { fill: var(--mark-soft); }
.map.clickable .st { cursor: pointer; }
.map.clickable .st:not(.hl):hover { fill: var(--line); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.toolbar .meta { font-size: 0.85rem; color: var(--muted); }
.info { display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 12px; }
.info .name { font-size: 1.3rem; font-weight: 700; }
.info .name .en { font-size: 0.9rem; font-weight: 400; color: var(--muted); margin-left: 6px; }
.info dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0 0; }
.info dt { font-size: 0.8rem; color: var(--muted); }
.info dd { margin: 0; }
.group-h { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; color: var(--muted); margin: 8px 0 0; }
.group-h .span { font-family: var(--font-mono); font-weight: 500; letter-spacing: 0; margin-left: 8px; }
.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.tbl th { text-align: left; font-size: 0.72rem; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; padding: 4px 8px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr[data-state] { cursor: pointer; }
.tbl tr[data-state]:hover td { background: var(--bg); }
.tbl tr.sel td { background: var(--mark-soft); }
.tbl .en { display: block; font-size: 0.78rem; color: var(--muted); }
.tbl td { width: 50%; }
.tbl .nm { font-weight: 500; }
.tbl .memo { display: block; margin-top: 2px; font-size: 0.8rem; color: var(--mark); }
.items { list-style: none; margin: 0; padding: 0; display: grid; }
.item { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item .lead { font-family: var(--font-mono); font-weight: 600; color: var(--mark); font-variant-numeric: tabular-nums; }
.item .title { font-weight: 700; }
.item .title .star { color: var(--mark); margin-right: 4px; }
.item .sub { font-size: 0.82rem; color: var(--muted); }
.item .body { margin: 2px 0 0; font-size: 0.92rem; max-width: 62ch; }
.item.qa { grid-template-columns: minmax(0, 1fr); }
.face {
  display: block; width: 56px; height: 70px; object-fit: cover; object-position: center top;
  border-radius: 6px; background: var(--land);
}
.face.lg { width: 72px; height: 90px; }
.item .lead .face { margin-top: 6px; }
.faces { display: flex; flex-wrap: wrap; gap: 10px; }
.faces figure { margin: 0; display: grid; gap: 4px; justify-items: start; }
.faces figcaption { font-size: 0.75rem; color: var(--muted); }
img.face[data-face] { cursor: zoom-in; }
.zoom {
  border: 0; padding: 0; margin: auto; background: transparent; max-width: calc(100vw - 32px); max-height: calc(100dvh - 32px);
}
.zoom::backdrop { background: rgb(0 0 0 / 0.75); }
.zoom figure { margin: 0; display: grid; gap: 10px; justify-items: center; cursor: zoom-out; }
.zoom img {
  display: block; width: min(400px, calc(100vw - 32px)); max-height: calc(100dvh - 110px); object-fit: contain;
  border-radius: 10px; background: var(--land);
}
.zoom figcaption { color: #fff; font-weight: 700; text-align: center; line-height: 1.5; }
.zoom figcaption small { display: block; font-weight: 400; opacity: 0.8; }
.pill { display: inline-block; font-size: 0.7rem; font-weight: 700; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; margin-left: 6px; color: var(--muted); white-space: nowrap; vertical-align: 1px; }
.pill.dem { color: var(--mark); }
.pill.rep { color: var(--star); }
.secret { border-radius: 4px; }
.hiding .secret:not(.shown) { background: var(--land); cursor: pointer; }
.hiding .secret:not(.shown), .hiding .secret:not(.shown) * { color: transparent !important; border-color: transparent !important; }
@media (prefers-reduced-motion: no-preference) {
  .map .st { transition: fill 0.25s ease; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>アメリカ基礎クイズ</h1>
    <p class="lede">50州と州都、地図上の位置、歴代大統領、歴史の年号。「覚える」で一覧と地図を見て、「クイズ」で確かめる。</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="モード">
    <button type="button" class="tab" role="tab" id="tab-study" data-view="study" aria-selected="true">覚える</button>
    <button type="button" class="tab" role="tab" id="tab-quiz" data-view="quiz" aria-selected="false">クイズ</button>
  </nav>

  <div class="view" id="view-study">
    <div class="seg" id="study-subs" role="group" aria-label="学習する分野"></div>
    <main class="card" id="study"></main>
  </div>

  <div class="view" id="view-quiz" hidden>
  <section class="settings" aria-label="出題設定">
    <span class="label">出題ジャンル</span>
    <div class="chips" id="cats"></div>
    <div class="row" id="star-row">
      <div class="seg" id="star-scope" role="group" aria-label="歴史と年号の出題範囲">
        <button type="button" data-star="1">★の年号だけ</button>
        <button type="button" data-star="0">全部の年号</button>
      </div>
    </div>
    <div class="row">
      <div class="seg" id="counts" role="group" aria-label="問題数">
        <button type="button" id="count-10" data-n="10" aria-pressed="true">10問</button>
        <button type="button" id="count-20" data-n="20" aria-pressed="false">20問</button>
        <button type="button" id="count-30" data-n="30" aria-pressed="false">30問</button>
      </div>
      <button type="button" class="btn ghost" id="restart">この設定で始め直す</button>
    </div>
  </section>

  <main class="card" id="card" aria-live="polite"></main>
  </div>

  <footer>クイズのキー操作: 1〜4で回答（並び替えは順に押す）、Enterで次へ。ジャンル右の数字はこのブラウザでの累計正答率。地図データ: us-atlas。大統領の肖像: Wikimedia Commons（パブリックドメイン／CC0）。</footer>
</div>

<dialog class="zoom" id="zoom" aria-label="肖像の拡大">
  <figure><img alt=""><figcaption></figcaption></figure>
</dialog>

<script src="map-data.js"></script>

    ["北米最高峰デナリがある州は？","アラスカ",["コロラド","ワシントン","カリフォルニア"],"標高6,190m。2015年に旧称マッキンリー山からデナリに戻された（2025年に連邦政府は再びマッキンリーに変更）。","北米最高峰デナリがある州","アラスカ州（標高6,190m）","2015年に旧称マッキンリー山からデナリに戻された（2025年に連邦政府は再びマッキンリーに変更）。"],

    ["面積が最も大きい州は？","アラスカ",["テキサス","カリフォルニア","モンタナ"],"テキサスの約2.5倍の広さがある。","面積が最も大きい州","アラスカ","テキサス（2位）の約2.5倍の広さがある。"],
    ["面積が最も小さい州は？","ロードアイランド",["デラウェア","コネチカット","ハワイ"],"2番目に小さいのはデラウェア。","面積が最も小さい州","ロードアイランド","2番目に小さいのはデラウェア。"],
    ["ミシシッピ川が最後に流れ込むのは？","メキシコ湾",["大西洋","太平洋","五大湖"],"ルイジアナ州ニューオーリンズの下流で注ぐ。2025年から米政府は「アメリカ湾」と呼んでいる。","ミシシッピ川が流れ込む先","メキシコ湾","ルイジアナ州ニューオーリンズの下流で注ぐ。2025年から米政府は「アメリカ湾」と呼んでいる。"],
  ].map(([q, a, wrong, note, topic, fact, memo]) => ({ q, a, wrong, note, topic, fact, memo }));

  const CATS = [
    { id: "map", name: "州と地図" },
    { id: "capital", name: "州都" },
    { id: "president", name: "大統領" },
    { id: "history", name: "歴史と年号" },
    { id: "trivia", name: "しくみ・雑学" },
  ];

  // ---------- ユーティリティ ----------
  const rand = (n) => Math.floor(Math.random() * n);
  const pick = (arr) => arr[rand(arr.length)];
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  const sample = (arr, n) => shuffle(arr).slice(0, n);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // 正解と重複しない誤答を、優先候補から順に集めて3つにする
  const fill = (answer, ...pools) => {
    const out = [];
    for (const pool of pools) for (const v of pool) {
      if (out.length < 3 && v && v !== answer && !out.includes(v)) out.push(v);
    }
    return out;
  };
  const stateBy = Object.fromEntries(STATES.map((s) => [s.id, s]));
  const presBy = Object.fromEntries(PRESIDENTS.map((p) => [p.n, p]));
  const stateNote = (s) =>
    `${s.jp}州（${s.en}）は${REGION[s.region]}の州で、州都は${s.cap}（${s.capEn}）。${STATE_NOTE[s.id] || ""}`;
  // 同じ文字で始まる略号は取り違えやすいので、まとめて見せる
  const abbrNote = (s) => {
    const same = STATES.filter((x) => x.ab[0] === s.ab[0]);
    const list = same.length >= 3 ? `${s.ab[0]}で始まる略号：${same.map((x) => `${x.ab} ${x.jp}`).join("、")}。` : "";
    return `${s.jp}州（${s.en}）の略号は${s.ab}。${list}`;
  };
  // ○×問題は2択を固定の並びで出す
  const TF = ["○ 正しい", "× まちがい"];
  const tf = (truth, q) => ({ ...q, choices: TF, fixed: true, answer: truth ? TF[0] : TF[1] });
  // 読み込めなかった画像は消して、レイアウトを崩さない
  const faceImg = (n, cls = "") => {
    const path = PORTRAITS[n];
    if (!path) return "";
    return `<img class="face${cls ? " " + cls : ""}" src="${faceSrc(path, 250)}" alt="" loading="lazy" decoding="async" data-face="${n}" onerror="this.hidden=true">`;
  };
  const faceSrc = (path, w) => `https://upload.wikimedia.org/wikipedia/commons/thumb/${path}/${w}px-${path.split("/").pop()}`;
  const presNote = (p) => `第${p.n}代 ${p.name}（${p.en}）、在任 ${p.term}、${p.party}。${p.fact}`;

  // ---------- 出題 ----------
  const GEN = {
    map() {
      const s = pick(STATES);
      const mode = rand(3);
      if (mode === 1) return {
        key: "tap" + s.id,
        type: "maptap",
        prompt: `${s.jp}州はどこ？地図でタップ`, en: s.en,
        target: s.id,
        answer: s.jp + "州",
        note: stateNote(s),
      };
      if (mode === 2) {
        const same = shuffle(STATES.filter((x) => x !== s && x.ab[0] === s.ab[0]));
        if (rand(2)) return {
          key: "ab0" + s.id,
          prompt: `略号「${s.ab}」の州は？`,
          answer: s.jp + "州", wrong: fill(s.jp + "州", same.map((x) => x.jp + "州"), shuffle(STATES).map((x) => x.jp + "州")),
          after: { hl: s.id },
          note: abbrNote(s),
        };
        return {
          key: "ab1" + s.id,
          prompt: `${s.jp}州の略号は？`,
          answer: s.ab, wrong: fill(s.ab, same.map((x) => x.ab), shuffle(STATES).map((x) => x.ab)),
          mono: true,
          after: { hl: s.id },
          note: abbrNote(s),
        };
      }
      const near = STATES.filter((x) => x.region === s.region);
      return {
        key: "map" + s.id,
        prompt: "地図で色がついている州は？",
        map: { hl: s.id },
        answer: s.jp + "州",
        wrong: fill(s.jp + "州", sample(near, 3).slice(0, 2).map((x) => x.jp + "州"), shuffle(STATES).map((x) => x.jp + "州")),
        after: { hl: s.id, dot: s.id },
        note: stateNote(s),
      };
    },
    capital() {
      const s = pick(STATES);
      const mode = rand(4);
      const caps = shuffle(STATES).map((x) => x.cap);
      const trapNote = s.trap ? `${s.trap}と間違えやすいので注意。` : "";
      if (mode === 0) return {
        key: "cap0" + s.id,
        prompt: `${s.jp}州の州都は？`, en: `Capital of ${s.en}`,
        map: { hl: s.id },
        answer: s.cap, wrong: fill(s.cap, [s.trap], caps),
        after: { hl: s.id, dot: s.id },
        note: stateNote(s) + trapNote,
      };
      if (mode === 1) return {
        key: "cap1" + s.id,
        prompt: `州都が${s.cap}なのはどの州？`, en: `${s.capEn} is the capital of…`,
        answer: s.jp + "州", wrong: fill(s.jp + "州", shuffle(STATES).map((x) => x.jp + "州")),
        after: { hl: s.id, dot: s.id },
        note: stateNote(s),
      };
      if (mode === 3) {
        // まちがいの文には、間違えやすい都市があればそれを使う
        const truth = rand(2) === 0;
        const city = truth ? s.cap : s.trap || pick(STATES.filter((x) => x !== s)).cap;
        return tf(truth, {
          key: "cap3" + s.id,
          prompt: `${city}は${s.jp}州の州都である。`,
          after: { hl: s.id, dot: s.id },
          note: stateNote(s) + trapNote,
        });
      }
      return {
        key: "cap2" + s.id,
        prompt: "地図の★の位置にある州都は？",
        map: { dot: s.id },
        answer: s.cap, wrong: fill(s.cap, [s.trap], caps),
        after: { hl: s.id, dot: s.id },
        note: stateNote(s) + trapNote,
      };
    },
    president() {
      const mode = rand(5);
      if (mode === 4) {
        // 2期目の重複（第24代・第47代）は並び順が決まらないので除く
        const four = sample(PRESIDENTS.filter((x) => x.n !== 24 && x.n !== 47), 4).sort((a, b) => a.n - b.n);
        return {
          key: "pres4" + four.map((x) => x.n).join(),
          type: "order",
          prompt: "就任した順（古い順）に並べよう",
          items: four.map((x) => x.name),
          faces: four.map((x) => x.n),
          note: four.map((x) => `第${x.n}代 ${x.name}（${x.term}）`).join(" → "),
        };
      }
      if (mode === 3) {
        const e = pick(EVENTS.filter((x) => x.pres));
        const p = presBy[e.pres];
        const truth = rand(2) === 0;
        const name = truth ? p.name : pick(PRESIDENTS.filter((x) => Math.abs(x.n - p.n) <= 6 && x.name !== p.name)).name;
        return tf(truth, {
          key: "pres3" + e.year,
          prompt: `「${e.title}」（${e.year}年）のときの大統領は${name}である。`,
          faces: [p.n],
          note: presNote(p),
        });
      }
      if (mode === 2) {
        const e = pick(EVENTS.filter((x) => x.pres));
        const p = presBy[e.pres];
        const near = PRESIDENTS.filter((x) => Math.abs(x.n - p.n) <= 6);
        return {
          key: "pres2" + e.year,
          prompt: `「${e.title}」（${e.year}年）のときの大統領は？`,
          answer: p.name, wrong: fill(p.name, shuffle(near).map((x) => x.name)),
          faces: [p.n],
          note: presNote(p),
        };
      }
      // 途中の代は番号では答えにくいので、番号で聞くのは有名な大統領だけにして、ほかはひとことから答えさせる
      const p = mode === 0 ? presBy[pick(FAMOUS_NUMBERS)] : pick(PRESIDENTS);
      const near = PRESIDENTS.filter((x) => Math.abs(x.n - p.n) <= 6);
      return {
        key: "pres" + mode + p.n,
        prompt: mode === 0 ? `${p.n === 1 ? "初代" : `第${p.n}代`}大統領は？` : `${p.clue}この大統領は誰？`,
        answer: p.name, wrong: fill(p.name, shuffle(near).map((x) => x.name)),
        faces: [p.n],
        note: presNote(p),
      };
    },
    history() {
      const events = historyEvents();
      const mode = rand(4);
      if (mode === 2) {
        const four = sample(events, 4).sort((a, b) => a.year - b.year);
        return {
          key: "hist2" + four.map((x) => x.year).join(),
          type: "order",
          prompt: "古い順に並べよう",
          items: four.map((x) => x.title),
          note: four.map((x) => `${x.year}年 ${x.title}`).join(" → "),
        };
      }
      const e = pick(events);
      // 近い年の出来事ほど誤答に選ばれやすくして、難しすぎず易しすぎない4択にする
      const near = events.filter((x) => x !== e).sort((a, b) => Math.abs(a.year - e.year) - Math.abs(b.year - e.year)).slice(0, 6);
      if (mode === 3) {
        const truth = rand(2) === 0;
        if (rand(2)) {
          const year = truth ? e.year : pick(near).year;
          return tf(truth, {
            key: "hist3" + e.year,
            prompt: `「${e.title}」は${year}年の出来事である。`,
            note: `${e.year}年：${e.note}`,
          });
        }
        // 前後の比較は、年が近い出来事どうしにして簡単になりすぎないようにする
        const o = pick(near);
        const [a, b] = truth === (e.year < o.year) ? [e, o] : [o, e];
        return tf(a.year < b.year, {
          key: "hist4" + [e.year, o.year].sort().join(),
          prompt: `「${a.title}」は「${b.title}」より前に起きた。`,
          note: [e, o].sort((x, y) => x.year - y.year).map((x) => `${x.year}年 ${x.title}`).join(" → "),
        });
      }
      if (mode === 0) return {
        key: "hist0" + e.year,
        prompt: `「${e.title}」が起きた年は？`,
        answer: e.year + "年", wrong: fill(e.year + "年", shuffle(near).map((x) => x.year + "年")),
        mono: true,
        note: `${e.year}年：${e.note}`,
      };
      return {
        key: "hist1" + e.year,
        prompt: `${e.year}年の出来事は？`,
        answer: e.title, wrong: fill(e.title, shuffle(near).map((x) => x.title)),
        note: `${e.year}年：${e.note}`,
      };
    },
    trivia() {
      const t = pick(TRIVIA);
      return { key: "triv" + t.q, prompt: t.q, answer: t.a, wrong: t.wrong, note: t.note };
    },
  };

  function makeQuestion(cat, used) {
    let q;
    for (let i = 0; i < 40; i++) {
      q = GEN[cat]();
      if (!used.has(q.key)) break;
    }
    used.add(q.key);
    q.cat = cat;
    q.type ||= "choice";
    if (q.type === "order") {
      q.answer = q.items.join(" → ");
      q.choices = shuffle(q.items);
    } else if (q.type === "choice" && !q.choices) {
      q.choices = shuffle([q.answer, ...q.wrong]);
    }
    return q;
  }

  // ---------- 地図 ----------
  const MAP = window.US_MAP;
  const SMALL_AREA = 2500;
  // 北東部の小さな州を押せるように拡大表示する範囲（x, y, 幅, 高さ）
  const ZOOM_BOX = [770, 40, 205, 250];
  const inZoomBox = (id) => {
    const [x, y] = MAP.states[id].c;
    const [bx, by, bw, bh] = ZOOM_BOX;
    return x >= bx && x <= bx + bw && y >= by && y <= by + bh;
  };
  function starPath(x, y, r) {
    let d = "";
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.45 : r;
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      d += (i ? "L" : "M") + (x + rr * Math.cos(a)).toFixed(1) + "," + (y + rr * Math.sin(a)).toFixed(1);
    }
    return d + "Z";
  }
  function mapSvg(opt) {
    if (!MAP) return "";
    const { hl, ng, dot, rg, click, names, zoom } = opt;
    const k = zoom ? ZOOM_BOX[2] / 975 : 1;
    const viewBox = zoom ? ZOOM_BOX.join(" ") : "0 0 975 610";
    let s = `<svg class="map${click ? " clickable" : ""}" viewBox="${viewBox}" role="img" aria-label="アメリカ合衆国の地図${zoom ? "（北東部を拡大）" : ""}">`;
    for (const [id, st] of Object.entries(MAP.states)) {
      const cls = id === hl ? " hl" : id === ng ? " ng" : rg && stateBy[id]?.region === rg ? " rg" : "";
      const title = names && stateBy[id] ? `<title>${stateBy[id].jp}州</title>` : "";
      s += `<path class="st${cls}" data-id="${id}" d="${st.d}">${title}</path>`;
    }
    s += `<path class="borders" d="${MAP.borders}"></path>`;
    if (hl && !zoom && MAP.states[hl].a < SMALL_AREA) {
      const [cx, cy] = MAP.states[hl].c;
      s += `<circle class="ring" cx="${cx}" cy="${cy}" r="18"></circle>`;
    }
    if (dot && MAP.states[dot].cap) {
      const [x, y] = MAP.states[dot].cap;
      s += `<path class="capstar" d="${starPath(x, y, 11 * Math.max(k, 0.4))}"></path>`;
    }
    return s + "</svg>";
  }

  // ---------- 成績(このブラウザのみ) ----------
  const STORE_KEY = "usquiz.stats.v1";
  let stats = {};
  try { stats = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch { stats = {}; }
  function record(cat, ok) {
    const s = (stats[cat] ||= { n: 0, c: 0 });
    s.n++; if (ok) s.c++;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(stats)); } catch {}
  }

  // ---------- 状態と描画 ----------
  const $cats = document.getElementById("cats");
  const $card = document.getElementById("card");
  let selected = new Set(CATS.map((c) => c.id));
  let count = 10;
  let game;
  // クイズの地図の表示範囲。答えの場所のヒントにならないよう、問題をまたいで利用者の選択を保つ
  let quizZoom = false;

  function renderCats() {
    $cats.innerHTML = CATS.map((c) => {
      const s = stats[c.id];
      const rate = s && s.n ? `<span class="rate">${Math.round((s.c / s.n) * 100)}%</span>` : "";
      return `<button type="button" class="chip" id="cat-${c.id}" data-cat="${c.id}" aria-pressed="${selected.has(c.id)}">${c.name}${rate}</button>`;
    }).join("");
    document.getElementById("star-row").hidden = !selected.has("history");
    document.querySelectorAll("#star-scope button").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.star === "1") === starOnly)));
  }

  function newGame(questions) {
    if (!questions) {
      const used = new Set();
      const ids = CATS.map((c) => c.id).filter((id) => selected.has(id));
      const order = shuffle(Array.from({ length: count }, (_, i) => ids[i % ids.length]));
      questions = order.map((cat) => makeQuestion(cat, used));
    }
    game = { qs: questions, i: 0, results: [], answered: null, picking: [] };
    renderQuestion();
  }

  function stripes() {
    return `<div class="stripes" aria-hidden="true">` + game.qs.map((_, i) => {
      const r = game.results[i];
      const cls = r === true ? "ok" : r === false ? "ng" : i === game.i ? "now" : "";
      return `<i class="${cls}"></i>`;
    }).join("") + `</div>`;
  }

  function renderQuestion() {
    const q = game.qs[game.i];
    const done = game.answered !== null;
    const score = game.results.filter(Boolean).length;
    const catName = CATS.find((c) => c.id === q.cat).name;
    let mapOpt = done ? q.after || q.map : q.map;
    let zoomSeg = "";
    if (q.type === "maptap") {
      // 拡大中に答えが範囲外だったときは、正解が見えるように全体表示にする
      const zoom = quizZoom && !(done && !inZoomBox(q.target));
      mapOpt = done ? { hl: q.target, ng: game.picked !== q.target ? game.picked : null, zoom } : { click: true, zoom };
      zoomSeg = `<div class="seg" role="group" aria-label="地図の表示範囲" style="justify-self:start">
          <button type="button" data-qzoom="0" aria-pressed="${!zoom}">全体</button>
          <button type="button" data-qzoom="1" aria-pressed="${zoom}">北東部を拡大</button>
        </div>`;
    }
    let html = `
      <div class="status"><span>問題 <span class="num">${game.i + 1} / ${game.qs.length}</span></span><span>正解 <span class="num">${score}</span></span></div>
      ${stripes()}
      <span class="tag">${esc(catName)}</span>
      <p class="prompt">${esc(q.prompt)}${q.en ? `<span class="en">${esc(q.en)}</span>` : ""}</p>
      ${zoomSeg}
      ${mapOpt ? mapSvg(mapOpt) : ""}
      ${q.type === "order" ? orderHtml(q, done) : q.type === "choice" ? choicesHtml(q, done) : ""}`;
    if (done) {
      const ok = game.results[game.i];
      const last = game.i === game.qs.length - 1;
      const picked = q.type === "maptap" && !ok && stateBy[game.picked] ? `（選んだのは${stateBy[game.picked].jp}州）` : "";
      html += `
        <div class="feedback">
          <div class="verdict ${ok ? "ok" : "ng"}">${ok ? "正解" : `不正解。正解は「${esc(q.answer)}」${picked}`}</div>
          ${q.faces ? facesHtml(q.faces) : ""}
          <p class="note">${esc(q.note)}</p>
          <div class="actions"><button type="button" class="btn" id="next">${last ? "結果を見る" : "次の問題"}</button></div>
        </div>`;
    }
    $card.innerHTML = html;
    if (done) document.getElementById("next").focus();
  }

  // 解説に添える肖像。1人なら名前、複数（並び替え）なら代を添える
  function facesHtml(ns) {
    return `<div class="faces">` + ns.map((n) => `
      <figure>${faceImg(n, ns.length > 1 ? "" : "lg")}<figcaption>${ns.length > 1 ? `第${n}代` : `第${n}代 ${esc(presBy[n].name)}`}</figcaption></figure>`).join("") + `</div>`;
  }

  function choicesHtml(q, done) {
    return `<div class="choices">` + q.choices.map((c, i) => {
      let cls = "";
      if (done && c === q.answer) cls = " ok";
      else if (done && c === game.answered) cls = " ng";
      return `<button type="button" class="choice${cls}" id="choice-${i}" data-i="${i}"${done ? " disabled" : ""}><span class="key">${i + 1}</span><span class="txt${q.mono ? " mono" : ""}">${esc(c)}</span></button>`;
    }).join("") + `</div>`;
  }

  // 並び替え: 押した順に番号が付き、番号付きのものをもう一度押すと取り消す。全部押したら答え合わせ
  function orderHtml(q, done) {
    const pos = (i) => game.picking.indexOf(i) + 1;
    return `${done ? "" : `<p class="hint" style="margin:0">順番にタップ。番号の付いたものをもう一度タップすると取り消せます。</p>`}
      <div class="choices one">` + q.choices.map((c, i) => {
      const n = pos(i);
      let cls = n ? " picked" : "";
      if (done) cls = q.items[n - 1] === c ? " ok" : " ng";
      return `<button type="button" class="choice${cls}" id="choice-${i}" data-o="${i}"${done ? " disabled" : ""}><span class="ord" aria-label="${n ? `${n}番目` : "未選択"}">${n || ""}</span><span class="txt">${esc(c)}</span></button>`;
    }).join("") + `</div>`;
  }

  function finish(ok, answered) {
    const q = game.qs[game.i];
    game.answered = answered;
    game.results[game.i] = ok;
    record(q.cat, ok);
    renderQuestion();
  }

  const answering = () => game && game.answered === null && game.i < game.qs.length;

  function answer(i) {
    if (!answering()) return;
    const q = game.qs[game.i];
    if (q.type !== "choice" || !(i in q.choices)) return;
    finish(q.choices[i] === q.answer, q.choices[i]);
  }

  function pickOrder(i) {
    if (!answering()) return;
    const q = game.qs[game.i];
    if (q.type !== "order" || !(i in q.choices)) return;
    const at = game.picking.indexOf(i);
    if (at >= 0) game.picking.splice(at, 1);
    else game.picking.push(i);
    if (game.picking.length < q.choices.length) return renderQuestion();
    const order = game.picking.map((x) => q.choices[x]);
    finish(order.every((c, k) => c === q.items[k]), order.join(" → "));
  }

  function tapState(id) {
    if (!answering()) return;
    const q = game.qs[game.i];
    if (q.type !== "maptap" || !stateBy[id]) return;
    game.picked = id;
    finish(id === q.target, stateBy[id].jp + "州");
  }

  function next() {
    if (!game || game.answered === null) return;
    game.answered = null;
    game.picking = [];
    game.picked = null;
    game.i++;
    if (game.i >= game.qs.length) renderResult();
    else renderQuestion();
  }

  function renderResult() {
    renderCats();
    const score = game.results.filter(Boolean).length;
    const missed = game.qs.filter((_, i) => !game.results[i]);
    const comment = score === game.qs.length ? "全問正解。"
      : score / game.qs.length >= 0.8 ? "よくできています。間違えた問題を見直しておきましょう。"
      : score / game.qs.length >= 0.5 ? "半分以上正解。解説を読んでもう一度挑戦してみましょう。"
      : "まずは間違えた問題の解説から確認しましょう。";
    $card.innerHTML = `
      <div class="result" style="display:grid;gap:12px">
        ${stripes()}
        <h2>${score}<small>/ ${game.qs.length} 問正解</small></h2>
        <p class="note">${comment}</p>
        ${missed.length ? `<span class="label">間違えた問題</span><ul class="missed">` + missed.map((q) =>
          `<li><div class="q">${esc(q.prompt)}</div><div class="a">正解：${esc(q.answer)}</div></li>`).join("") + `</ul>` : ""}
        <div class="actions">
          ${missed.length ? `<button type="button" class="btn ghost" id="retry">間違えた問題だけもう一度</button>` : ""}
          <button type="button" class="btn" id="again">新しい問題で続ける</button>
        </div>
      </div>`;
    game.missed = missed;
    game.i = game.qs.length;
    document.getElementById("again").focus();
  }

  // ---------- イベント ----------
  $cats.addEventListener("click", (e) => {
    const b = e.target.closest("[data-cat]");
    if (!b) return;
    const id = b.dataset.cat;
    if (selected.has(id)) { if (selected.size > 1) selected.delete(id); }
    else selected.add(id);
    renderCats();
  });
  document.getElementById("star-scope").addEventListener("click", (e) => {
    const b = e.target.closest("[data-star]");
    if (!b) return;
    setStarOnly(b.dataset.star === "1");
    renderCats();
  });
  document.getElementById("counts").addEventListener("click", (e) => {
    const b = e.target.closest("[data-n]");
    if (!b) return;
    count = Number(b.dataset.n);
    document.querySelectorAll("#counts button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  document.getElementById("restart").addEventListener("click", () => newGame());
  $card.addEventListener("click", (e) => {
    const c = e.target.closest("[data-i]");
    if (c) return answer(Number(c.dataset.i));
    const o = e.target.closest("[data-o]");
    if (o) return pickOrder(Number(o.dataset.o));
    const z = e.target.closest("[data-qzoom]");
    if (z) { quizZoom = z.dataset.qzoom === "1"; return renderQuestion(); }
    const path = e.target.closest("path[data-id]");
    if (path) return tapState(path.dataset.id);
    if (e.target.closest("#next")) return next();
    if (e.target.closest("#again")) return newGame();
    if (e.target.closest("#retry")) return newGame(shuffle(game.missed).map((q) => ({ ...q, choices: q.choices && !q.fixed ? shuffle(q.choices) : q.choices })));
  });
  // ---------- 覚える ----------
  const ERAS = [
    [0, 1762, "植民地時代"],
    [1763, 1800, "独立と建国"],
    [1801, 1860, "領土の拡大"],
    [1861, 1877, "南北戦争と再建"],
    [1878, 1945, "産業化と二つの世界大戦"],
    [1946, 9999, "戦後から現代"],
  ];
  const eraSpan = ([from, to]) => (from === 0 ? `〜${to}` : to === 9999 ? `${from}〜` : `${from}–${to}`);
  const byEra = (items, yearOf) => ERAS.map((era) => ({ era, items: items.filter((x) => yearOf(x) >= era[0] && yearOf(x) <= era[1]) }))
    .filter((g) => g.items.length);
  const SUBS = [
    { id: "states", name: "州と州都", hide: "州都を隠す" },
    { id: "presidents", name: "大統領", hide: "名前を隠す" },
    { id: "history", name: "歴史年表", hide: "年を隠す" },
    { id: "trivia", name: "しくみ・雑学", hide: "答えを隠す" },
  ];
  const $study = document.getElementById("study");
  const $subs = document.getElementById("study-subs");
  const study = { sub: "states", sel: "06", hide: {}, zoom: false };

  function stateMemo(s) {
    const parts = [];
    if (s.trap) parts.push(`${s.trap}ではない`);
    if (STATE_NOTE[s.id]) parts.push(STATE_NOTE[s.id]);
    return parts.join("。");
  }
  function stateInfo(s) {
    return `
      <div class="name">${s.jp}州<span class="en">${s.en}</span></div>
      <dl>
        <dt>州都</dt><dd><span class="secret">${s.cap}（${s.capEn}）</span></dd>
        <dt>略号</dt><dd class="mono">${s.ab}</dd>
        <dt>地域</dt><dd>${REGION[s.region]}</dd>
        ${stateMemo(s) ? `<dt>メモ</dt><dd>${esc(stateMemo(s))}</dd>` : ""}
      </dl>`;
  }
  function selectState(id, scroll) {
    if (!stateBy[id]) return;
    study.sel = id;
    const s = stateBy[id];
    // 拡大中に範囲外の州を選んだら、見えるように全体表示へ戻す
    if (study.zoom && !inZoomBox(id)) study.zoom = false;
    document.querySelectorAll("#zoom-seg button").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.zoom === "1") === study.zoom)));
    document.getElementById("study-map").innerHTML = mapSvg({ hl: id, dot: id, rg: s.region, click: true, names: true, zoom: study.zoom });
    document.getElementById("study-info").innerHTML = stateInfo(s);
    $study.querySelectorAll("tr[data-state]").forEach((tr) => tr.classList.toggle("sel", tr.dataset.state === id));
    if (scroll) {
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.getElementById("study-map").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
    }
  }

  const VIEWS = {
    states() {
      const groups = Object.keys(REGION).map((rg) => {
        const rows = STATES.filter((s) => s.region === rg).map((s) => `
          <tr data-state="${s.id}"${s.id === study.sel ? ' class="sel"' : ""}>
            <td><span class="nm">${s.jp}</span><span class="en">${s.en} · ${s.ab}</span>${stateMemo(s) ? `<span class="memo">${esc(stateMemo(s))}</span>` : ""}</td>
            <td><span class="secret"><span class="nm">${s.cap}</span><span class="en">${s.capEn}</span></span></td>
          </tr>`).join("");
        return `<h3 class="group-h">${REGION[rg]}<span class="span">${STATES.filter((s) => s.region === rg).length}州</span></h3>
          <div class="tbl"><table><thead><tr><th>州</th><th>州都</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }).join("");
      return {
        meta: "50州・4地域。地図の州か表の行をタップすると詳しく表示",
        html: `<div class="seg" id="zoom-seg" role="group" aria-label="地図の表示範囲" style="justify-self:start">
            <button type="button" data-zoom="0" aria-pressed="${!study.zoom}">全体</button>
            <button type="button" data-zoom="1" aria-pressed="${study.zoom}">北東部を拡大</button>
          </div>
          <div id="study-map"></div><div class="info" id="study-info"></div>${groups}`,
      };
    },
    presidents() {
      const party = (p) => (p === "民主党" ? "dem" : p === "共和党" ? "rep" : "");
      const groups = byEra(PRESIDENTS, (p) => parseInt(p.term, 10)).map(({ era, items }) => `
        <h3 class="group-h">${era[2]}<span class="span">${eraSpan(era)}</span></h3>
        <ul class="items">${items.map((p) => `
          <li class="item">
            <div class="lead">第${p.n}代${faceImg(p.n)}</div>
            <div>
              <div class="title"><span class="secret">${p.name}<span class="sub"> ${p.en}</span></span><span class="pill ${party(p.party)}">${p.party}</span></div>
              <div class="sub">${p.term}</div>
              <p class="body">${esc(p.fact)}</p>
            </div>
          </li>`).join("")}</ul>`).join("");
      return { meta: "第1代〜第47代。クリーブランドとトランプは連続しない2期", html: groups };
    },
    history() {
      const stars = EVENTS.filter((e) => e.star).length;
      const groups = byEra(historyEvents(), (e) => e.year).map(({ era, items }) => `
        <h3 class="group-h">${era[2]}<span class="span">${eraSpan(era)}</span></h3>
        <ul class="items">${items.map((e) => `
          <li class="item">
            <span class="lead"><span class="secret">${e.year}</span></span>
            <div>
              <div class="title">${e.star ? `<span class="star">★</span>` : ""}${esc(e.title)}</div>
              ${e.pres ? `<div class="sub">大統領：第${e.pres}代 ${presBy[e.pres].name}</div>` : ""}
              <p class="body">${esc(e.note)}</p>
            </div>
          </li>`).join("")}</ul>`).join("");
      return {
        meta: starOnly ? `まず覚える★の${stars}件（全${EVENTS.length}件）` : `${EVENTS[0].year}年〜${EVENTS[EVENTS.length - 1].year}年の${EVENTS.length}の出来事`,
        tools: `<button type="button" id="star-toggle" aria-pressed="${starOnly}">★だけ表示</button>`,
        html: groups,
      };
    },
    trivia() {
      return {
        meta: `${TRIVIA.length}項目`,
        html: `<ul class="items">${TRIVIA.map((t) => `
          <li class="item qa">
            <div class="title">${esc(t.topic)}</div>
            <div><span class="secret"><strong>${esc(t.fact)}</strong></span></div>
            ${t.memo ? `<p class="body sub">${esc(t.memo)}</p>` : ""}
          </li>`).join("")}</ul>`,
      };
    },
  };

  function renderStudy() {
    $subs.innerHTML = SUBS.map((s) =>
      `<button type="button" id="sub-${s.id}" data-sub="${s.id}" aria-pressed="${s.id === study.sub}">${s.name}</button>`).join("");
    const sub = SUBS.find((s) => s.id === study.sub);
    const v = VIEWS[study.sub]();
    const hiding = !!study.hide[study.sub];
    $study.className = "card" + (hiding ? " hiding" : "");
    $study.innerHTML = `
      <div class="toolbar">
        <span class="meta">${v.meta}</span>
        <div class="seg">${v.tools || ""}<button type="button" id="hide-toggle" aria-pressed="${hiding}">${sub.hide}</button></div>
      </div>
      ${hiding ? `<p class="hint" style="margin:0">隠した部分をタップすると表示されます。思い出してからタップしましょう。</p>` : ""}
      ${v.html}`;
    if (study.sub === "states") selectState(study.sel);
  }

  $subs.addEventListener("click", (e) => {
    const b = e.target.closest("[data-sub]");
    if (!b || b.dataset.sub === study.sub) return;
    study.sub = b.dataset.sub;
    renderStudy();
  });
  $study.addEventListener("click", (e) => {
    if (e.target.closest("#star-toggle")) {
      setStarOnly(!starOnly);
      renderCats();
      return renderStudy();
    }
    if (e.target.closest("#hide-toggle")) {
      study.hide[study.sub] = !study.hide[study.sub];
      return renderStudy();
    }
    const secret = e.target.closest(".secret");
    if (secret && $study.classList.contains("hiding") && !secret.classList.contains("shown")) {
      secret.classList.add("shown");
      return;
    }
    const zb = e.target.closest("[data-zoom]");
    if (zb) {
      study.zoom = zb.dataset.zoom === "1";
      // 拡大範囲外の州を選んでいたら、拡大範囲の中の州に選び直す
      if (study.zoom && !inZoomBox(study.sel)) study.sel = "25";
      return selectState(study.sel);
    }
    const path = e.target.closest("path[data-id]");
    if (path) return selectState(path.dataset.id);
    const row = e.target.closest("tr[data-state]");
    if (row) return selectState(row.dataset.state, true);
  });

  // ---------- モード切替 ----------
  const TAB_KEY = "usquiz.tab.v1";
  let view = "study";
  function showView(v) {
    view = v;
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.view === v)));
    document.getElementById("view-study").hidden = v !== "study";
    document.getElementById("view-quiz").hidden = v !== "quiz";
    try { localStorage.setItem(TAB_KEY, v); } catch {}
  }
  document.querySelector(".tabs").addEventListener("click", (e) => {
    const t = e.target.closest("[data-view]");
    if (t) showView(t.dataset.view);
  });

  // 肖像をクリックすると大きく表示する。どこかを押すか Esc で閉じる
  const zoom = document.getElementById("zoom");
  const zoomImg = zoom.querySelector("img");
  document.addEventListener("click", (e) => {
    const face = e.target.closest("img[data-face]");
    if (!face) return;
    const p = presBy[face.dataset.face];
    const path = PORTRAITS[p.n];
    zoomImg.onerror = () => { zoomImg.onerror = null; zoomImg.src = face.src; };
    zoomImg.src = faceSrc(path, 500);
    zoomImg.alt = p.name;
    zoom.querySelector("figcaption").innerHTML = `第${p.n}代 ${esc(p.name)}<small>${esc(p.en)}（${esc(p.term)}）</small>`;
    zoom.showModal();
  });
  zoom.addEventListener("click", () => zoom.close());

  document.addEventListener("keydown", (e) => {
    if (view !== "quiz" || zoom.open) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[1-4]$/.test(e.key)) {
      const i = Number(e.key) - 1;
      if (game?.qs[game.i]?.type === "order") pickOrder(i);
      else answer(i);
    }
    else if (e.key === "Enter" && game && game.answered !== null && document.activeElement?.id !== "next") { e.preventDefault(); next(); }
  });

  renderCats();
  newGame();
  renderStudy();
  let savedTab = null;
  try { savedTab = localStorage.getItem(TAB_KEY); } catch {}
  showView(savedTab === "quiz" ? "quiz" : "study");
})();
</script>

</body>
</html>
